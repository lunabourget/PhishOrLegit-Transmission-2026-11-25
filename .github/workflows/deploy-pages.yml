name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: PhishOrLegit-Transmission-2026-11-25/PhishOrLegit/pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: PhishOrLegit-Transmission-2026-11-25/PhishOrLegit
        run: pnpm install --frozen-lockfile

      - name: Validate and export
        working-directory: PhishOrLegit-Transmission-2026-11-25/PhishOrLegit
        run: pnpm check

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: PhishOrLegit-Transmission-2026-11-25/PhishOrLegit/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
